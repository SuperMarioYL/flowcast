name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack tarball into dist/
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tgz > checksums.txt
          cat checksums.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowcast-npm-pack
          path: |
            dist/*.tgz
            dist/checksums.txt
      # Attach the tarball + checksums to the GitHub Release itself. The pack
      # job used to stop at upload-artifact and the publisher assumed this
      # workflow attached them — each side delegated to the other, so releases
      # shipped with zero assets (v0.7.0 shipped that way). The release is
      # created by the publisher right after the tag push, so poll briefly for
      # it to exist before uploading.
      - name: Attach artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in $(seq 1 36); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = "36" ]; then
              echo "Release $TAG did not appear within 3 minutes" >&2
              exit 1
            fi
            sleep 5
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.tgz dist/checksums.txt

  publish-npm:
    runs-on: ubuntu-latest
    needs: pack
    # Opt-in: set repository variable PUBLISH_NPM=true and add an NPM_TOKEN secret.
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
