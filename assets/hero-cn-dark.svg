<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="FlowCast — 录一次，永久重放，改版自愈">
  <defs>
    <linearGradient id="hg-cd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8985FF"/>
      <stop offset="1" stop-color="#2DC79A"/>
    </linearGradient>
    <marker id="hah-cd" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="300" fill="#1D1D1F"/>

  <text x="60" y="120" font-size="64" font-weight="700" fill="url(#hg-cd)">FlowCast</text>
  <text x="62" y="160" font-size="20" font-weight="500" fill="#F5F5F7">
    把一次浏览器走查录成可复用资产——录一次，永久重放，站点改版自动自愈。
  </text>
  <text x="62" y="190" font-size="14" font-weight="500" fill="#A1A1A8">
    面向浏览器 Agent 的参数化、可自愈流程资产原语——正常重放零 LLM 调用。
  </text>

  <g>
    <rect x="60"  y="225" width="150" height="48" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5"/>
    <text x="135" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#B7B4FF">录一次</text>

    <line x1="216" y1="249" x2="262" y2="249" stroke="#3A3A44" stroke-width="1.5" marker-end="url(#hah-cd)"/>

    <rect x="268" y="225" width="160" height="48" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5"/>
    <text x="348" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#7FE3C8">永久重放</text>

    <line x1="434" y1="249" x2="480" y2="249" stroke="#3A3A44" stroke-width="1.5" marker-end="url(#hah-cd)"/>

    <rect x="486" y="225" width="170" height="48" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="571" y="254" text-anchor="middle" font-size="15" font-weight="600" fill="#A6D2FF">改版自愈</text>
  </g>
</svg>
